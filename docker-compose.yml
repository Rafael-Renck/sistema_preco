version: '3.9'

services:
  # =======================
  # DEV: MySQL local
  # =======================
  db:
    profiles: ["dev"]
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --local-infile=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=384M
      --innodb-log-file-size=96M
      --innodb-lock-wait-timeout=120
      --innodb-deadlock-detect=ON
      --max-connections=100
      --table-open-cache=2000
      --tmp-table-size=64M
      --max-heap-table-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-operadora_saude}
    ports:
      - "3308:3306"  # porta 3308 para evitar conflito
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # =======================
  # DEV: sua app apontando para o db local
  # =======================
  web:
    profiles: ["dev"]
    build: .
    environment:
      # Dev sempre usa o MySQL do compose (não herda DATABASE_URL do host).
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db/${MYSQL_DATABASE:-operadora_saude}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      PUBLIC_API_TOKENS: ${PUBLIC_API_TOKENS:-}
      CBHPM_API_CACHE_TTL: ${CBHPM_API_CACHE_TTL:-300}
      DISABLE_LOGIN_LOCK: "1"
      DEV_AUTO_LOGIN: "0"
      REEMBOLSO_OCR_MAX_PAGES: "1"
      REEMBOLSO_OCR_DPI: "200"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    command: ["gunicorn", "-w", "1", "--max-requests", "200", "--max-requests-jitter", "50", "--timeout", "180", "--worker-class", "sync", "-b", "0.0.0.0:8000", "app:app"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - .:/app
    # command: ["flask", "run", "--host=0.0.0.0", "--port=8000"]

  adminer:
    profiles: ["dev"]
    image: adminer:latest
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"   # 8081 no host (8080 costuma estar ocupada no Windows/WSL)

  # =======================
  # PROD: sua app apontando para DB externo (192.168.40.84)
  # Servidor sem "docker compose" v2: use docker-compose.prod.yml
  # =======================
  web_prod:
    profiles: ["prod"]
    build: .
    environment:
      # Defina no .env de produção. Fallback abaixo é apenas exemplo.
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://appuser:SENHA@192.168.40.84:3306/operadora_saude}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      PUBLIC_API_TOKENS: ${PUBLIC_API_TOKENS:-}
      CBHPM_API_CACHE_TTL: ${CBHPM_API_CACHE_TTL:-300}
      FLASK_APP: app
      # Jobs ficam PENDING; o import_worker_prod processa em container dedicado.
      INSUMO_IMPORT_BACKGROUND_DISABLE: "1"
      INSUMO_IMPORT_ASYNC_DIR: /data/insumo_async_imports
    ports:
      - "8010:8000"
    volumes:
      - insumo_import_data:/data/insumo_async_imports
    # Sem depends_on, pois usa banco externo

  import_worker_prod:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://appuser:SENHA@192.168.40.84:3306/operadora_saude}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      FLASK_APP: app
      INSUMO_IMPORT_ASYNC_DIR: /data/insumo_async_imports
    volumes:
      - insumo_import_data:/data/insumo_async_imports
    command: ["flask", "insumos-import-worker", "--poll-interval", "5"]

  adminer_prod:
    profiles: ["prod"]
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-192.168.40.84}
    ports:
      - "8082:8080"   # 8082 no host (evita conflito com 8080/8081)

volumes:
  db_data:
  insumo_import_data:
