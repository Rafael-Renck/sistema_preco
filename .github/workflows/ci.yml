name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-format:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: |
          ruff check tests scripts migrations
          ruff check app.py --select E9,F63,F7,F82

      - name: Black (format check)
        run: black --check tests migrations

      - name: Validar sintaxe Python
        run: python -m compileall -q app.py rol_import.py tests scripts migrations

  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas de segurança
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pip-audit (dependências)
        run: |
          IGNORE_ARGS=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              vulns = tomllib.load(f)['tool']['pip-audit']['ignore-vulns']
          print(' '.join(f'--ignore-vuln {v}' for v in vulns))
          ")
          pip-audit -r requirements.txt $IGNORE_ARGS --progress-spinner=off

      - name: Bandit (SAST)
        run: bandit -r scripts migrations -ll -c pyproject.toml

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests (SQLite)
        env:
          SKIP_ENSURE_DB: "1"
        run: pytest -m smoke -v --tb=short

      - name: Suite completa de testes (SQLite)
        env:
          SKIP_ENSURE_DB: "1"
        run: pytest -v --tb=short

  migrations:
    name: Migrations Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root
          MYSQL_DATABASE: operadora_saude
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar cadeia Alembic
        env:
          SKIP_ENSURE_DB: "1"
          DATABASE_URL: mysql+pymysql://root:ci_test_root@127.0.0.1:3306/operadora_saude
        run: |
          alembic -c alembic.ini heads
          alembic -c alembic.ini history
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini current

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker
        run: docker build -t sistema-preco:ci-${{ github.sha }} .

      - name: Smoke test na imagem
        run: |
          docker run --rm \
            -e SKIP_ENSURE_DB=1 \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            sistema-preco:ci-${{ github.sha }} \
            python -c "import app; print('import ok')"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint-format, security, test, migrations, build]
    if: always()
    steps:
      - name: Resumo e gate final
        run: |
          echo "lint-format: ${{ needs.lint-format.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "migrations: ${{ needs.migrations.result }}"
          echo "build: ${{ needs.build.result }}"
          FAILED=0
          for job in lint-format security test migrations build; do
            result=""
            case "$job" in
              lint-format) result="${{ needs.lint-format.result }}" ;;
              security) result="${{ needs.security.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              migrations) result="${{ needs.migrations.result }}" ;;
              build) result="${{ needs.build.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::error::Job $job falhou ($result)"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -ne 0 ]]; then
            echo "CI Gate: um ou mais jobs falharam (este job só consolida o resultado)."
            exit 1
          fi
          echo "Todos os jobs de CI passaram."
