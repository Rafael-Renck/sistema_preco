{# Componente de Input de Senha com Toggle de Visibilidade #}
{% macro password_input(name, label, placeholder='••••••••', value='', required=False, error=None, help_text='') %}
  <div class="form-group">
    <label for="{{ name }}" class="form-label">
      {{ label }}
      {% if required %}<span class="text-danger">*</span>{% endif %}
    </label>
    <div class="password-wrapper">
      <input
        type="password"
        id="{{ name }}"
        name="{{ name }}"
        class="form-control {% if error %}is-invalid{% endif %}"
        placeholder="{{ placeholder }}"
        value="{{ value }}"
        {% if required %}required{% endif %}
        data-toggle-password="#{{ name }}"
      />
      <button
        type="button"
        class="btn-toggle-password"
        data-target="#{{ name }}"
        data-toggle-password="{{ name }}"
        aria-label="Mostrar/ocultar senha"
        title="Mostrar/ocultar senha"
      >
        <i class="bi bi-eye"></i>
      </button>
    </div>

    {% if error %}
      <div class="invalid-feedback d-block">{{ error }}</div>
    {% elif help_text %}
      <small class="form-text text-muted d-block mt-1">{{ help_text }}</small>
    {% endif %}
  </div>
{% endmacro %}
