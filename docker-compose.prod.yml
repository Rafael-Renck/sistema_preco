version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: sistema_preco-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-lock-wait-timeout=120
      --innodb-deadlock-detect=ON
      --innodb-buffer-pool-size=512M
      --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_preco
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sistema_preco-web
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sistema_preco
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static

volumes:
  db_data:

