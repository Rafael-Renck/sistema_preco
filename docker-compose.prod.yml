# Produção — use quando o servidor não tiver "docker compose" (plugin v2).
# Deploy (projeto isolado do dev):
#   docker-compose -p sistema_preco_prod -f docker-compose.prod.yml up -d --build
#   ./scripts/deploy-prod.sh
version: '3.9'

services:
  web_prod:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://appuser:SENHA@192.168.40.84:3306/operadora_saude}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      PUBLIC_API_TOKENS: ${PUBLIC_API_TOKENS:-}
      CBHPM_API_CACHE_TTL: ${CBHPM_API_CACHE_TTL:-300}
      FLASK_APP: app
      INSUMO_IMPORT_BACKGROUND_DISABLE: "1"
      INSUMO_IMPORT_ASYNC_DIR: /data/insumo_async_imports
    ports:
      - "8010:8000"
    volumes:
      - insumo_import_data:/data/insumo_async_imports
      # Sincroniza migrations com git pull (sem rebuild só para Alembic)
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro
      - ./rol_import.py:/app/rol_import.py:ro

  import_worker_prod:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://appuser:SENHA@192.168.40.84:3306/operadora_saude}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      FLASK_APP: app
      INSUMO_IMPORT_ASYNC_DIR: /data/insumo_async_imports
    volumes:
      - insumo_import_data:/data/insumo_async_imports
    command: ["flask", "insumos-import-worker", "--poll-interval", "5"]

volumes:
  insumo_import_data:
